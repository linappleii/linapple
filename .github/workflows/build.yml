---
name: Multi-Distro Build (CMake)

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.markdownlint.json'
  pull_request:
    branches: [main, sdl3]
    paths-ignore:
      - '**.md'
      - '.markdownlint.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. Ubuntu All Frontends (SDL3, SDL2, SDL1, TUI, Headless)
  ubuntu-all-frontends:
    name: Ubuntu 24.04 (All Frontends)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ubuntu-all
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build imagemagick libzip-dev \
            libcurl4-openssl-dev zlib1g-dev git libxkbcommon-dev libz3-dev \
            libsdl2-dev libsdl1.2-dev libsdl-image1.2-dev libpulse-dev libasound2-dev
      - name: Setup SDL3
        uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          version-sdl-image: 3-latest
          install-linux-dependencies: true
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFRONTEND=all \
            -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build -j$(nproc) --output-on-failure
      - name: Install
        run: sudo cmake --install build

  # 2. Multi-Distro Matrix (Fedora, Arch Linux, Debian / Pi OS x86)
  distro-matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora Latest (SDL3)
            image: fedora:latest
            setup: |
              dnf install -y gcc-c++ cmake ninja-build ImageMagick libzip-devel \
                SDL3-devel SDL3_image-devel libcurl-devel zlib-devel git z3-devel curl
            frontend: sdl3

          - name: Arch Linux Rolling (SDL3)
            image: archlinux:latest
            setup: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm base-devel cmake ninja imagemagick libzip \
                sdl3 sdl3_image libcurl-gnutls zlib git z3 curl
            frontend: sdl3

          - name: Debian 12 / Pi OS x86 (SDL2)
            image: debian:bookworm-slim
            setup: |
              apt-get update
              apt-get install -y g++ cmake ninja-build imagemagick libzip-dev \
                libcurl4-openssl-dev zlib1g-dev git libxkbcommon-dev libz3-dev \
                libsdl2-dev curl
            frontend: sdl2

    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: ${{ matrix.setup }}
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DFRONTEND=${{ matrix.frontend }} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build -j$(nproc) --output-on-failure
      - name: Install
        run: cmake --install build

  # 3. Native ARM64 (Ubuntu / Raspberry Pi OS 64-bit Compatible)
  rpi-arm64:
    name: Native ARM64 (Ubuntu / Pi OS 64-bit)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-arm64
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build imagemagick libzip-dev \
            libcurl4-openssl-dev zlib1g-dev git libxkbcommon-dev libz3-dev
      - name: Setup SDL3
        uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          version-sdl-image: 3-latest
          install-linux-dependencies: true
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFRONTEND=sdl3 \
            -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build -j$(nproc) --output-on-failure
      - name: Install
        run: sudo cmake --install build

  # 4. Headless Build with Sanitizers (ASAN/UBSAN)
  headless-sanitizers:
    name: Headless Sanitizers (ASAN/UBSAN)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-sanitizers
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build imagemagick libzip-dev \
            libcurl4-openssl-dev zlib1g-dev git libxkbcommon-dev libz3-dev
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFRONTEND=headless \
            -DENABLE_ASAN=ON \
            -DENABLE_UBSAN=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        env:
          ASAN_OPTIONS: "detect_leaks=1"
          UBSAN_OPTIONS: "print_stacktrace=1"
        run: ctest --test-dir build -j$(nproc) --output-on-failure

  # 5. Static Analysis (clang-tidy)
  clang-tidy-check:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-tidy
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build clang-tidy imagemagick \
            libzip-dev libcurl4-openssl-dev zlib1g-dev git libxkbcommon-dev libz3-dev
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFRONTEND=headless \
            -DENABLE_CLANG_TIDY=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build & Analyze
        run: cmake --build build -j$(nproc)

  # 6. Fuzzing Smoke Test (libFuzzer + ASan/UBSan)
  fuzz-smoke:
    name: Fuzzing Smoke Test (Ubuntu 26.04 + Clang + libFuzzer)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-fuzz
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build imagemagick libzip-dev \
            libcurl4-openssl-dev zlib1g-dev git libxkbcommon-dev libz3-dev
      - name: Configure & Build
        run: |
          cmake -B build-fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFRONTEND=headless \
            -DENABLE_FUZZING=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build-fuzz -j$(nproc)
      - name: Run Fuzzers (10s each)
        run: |
          ./build-fuzz/fuzz-memory -max_total_time=10
          ./build-fuzz/fuzz-snapshot -max_total_time=10
          ./build-fuzz/fuzz-disk-loader -max_total_time=10
