# LinApple Configuration File
#
# Lines starting with '#' are comments.
# Key and value pairs use the format: Key = Value

[Configuration]

# Machine Architecture & Emulation:
#   0 - Apple ][
#   1 - Apple ][+
#   2 - Apple //e
#   3 - Apple //e Enhanced (Default)
Computer Emulation = 3

# Emulation speed multiplier:
#   0 (slowest) to 40 (fastest), 10 = 1.0 MHz (Default)
Emulation Speed = 10

# Accelerate CPU execution during floppy disk access:
#   0 - Authentic 1x floppy drive speed
#   1 - Fast disk access (Default)
Enhance Disk Speed = 1

# Automatically boot Disk 1 in Slot 6 at startup:
#   0 - Show startup splash / Applesoft prompt (Default)
#   1 - Automatically boot Disk 1
Boot at Startup = 0

# Auto-insert Master.dsk fallback if Drive 1 is empty at startup:
#   0 - Leave Drive 1 empty (Default)
#   1 - Insert Master.dsk automatically
Slot 6 Autoload = 0

# Automatically save state to Save State Filename on exit and restore on
# startup:
#   0 - Disabled (Default)
#   1 - Enabled
Save State On Exit = 0

# Integrated assembly debugger (F7):
#   0 - Debugger enabled (Default)
#   1 - Debugger disabled at runtime
Disable Debugger = 0

# Host file path for bidirectional Applesoft BASIC live syncing:
Basic Live Sync File =

# Applesoft BASIC live sync line numbering:
#   0 - Explicit: Host file lines must begin with BASIC line numbers
#       (e.g. '10 HOME', '20 PRINT') (Default)
#   1 - Positional: File line numbers map directly to BASIC line numbers
#       (1, 2, 3...) without line numbers in the file
Basic Line Numbering = 0

# TUI frontend rendering mode:
#   smart - Unicode half-block / Braille rendering (Default)
#   block - ASCII block rendering
TUI Render Mode = smart

# Video Standard:
#   0 - NTSC (60 Hz, Default)
#   1 - PAL (50 Hz)
Video Standard = 0

# Video Emulation Mode:
#   0 - Custom Monochrome (uses Monochrome Color)
#   1 - Color Standard (Default)
#   2 - Color Text Optimized
#   3 - Color TV Emulation
#   4 - Color Half-Shift
#   5 - Monochrome Amber
#   6 - Monochrome Green
#   7 - Monochrome White
Video Emulation = 1

# Custom Monochrome screen color in hex RGB format:
Monochrome Color = #C0C0C0

# Screen Zoom Factor (e.g. 1.0 = 560x384, 2.0 = 1120x768):
Screen factor = 1.0

# Explicit Window Dimensions (uncomment to override Screen factor):
# Screen Width  = 560
# Screen Height = 384

# Fullscreen display:
#   0 - Windowed mode (Default)
#   1 - Fullscreen mode
Fullscreen = 0

# Multithreaded video rendering:
#   0 - Multithreaded rendering enabled (Default)
#   1 - Singlethreaded rendering (recommended for low-resource platforms)
Singlethreaded = 0

# On-screen disk drive activity LEDs:
#   0 - Hide LEDs
#   1 - Show LEDs (Default)
Show Leds = 1

# Sound Emulation:
#   0 - Disabled
#   1 - SDL Audio enabled (Default)
Sound Emulation = 1

# Volume levels (0 = mute to 31 = maximum):
Speaker Volume      = 15
Mockingboard Volume = 15

# Slot 4 Sound Card Emulation:
#   0 - Uninitialized
#   1 - None
#   2 - Mockingboard (dual AY-3-8910 sound generators, Default)
#   3 - Phasor
Soundcard Type = 2

# Keyboard Layout & Video ROM:
#   0 - Automatic (selected from system locale, Default)
#   1 - US QWERTY
#   2 - UK QWERTY
#   3 - French AZERTY
#   4 - German QWERTZ
#   5 - Spanish ES QWERTY
Keyboard Type = 0

# Initial character set rocker switch setting (Apple //e only):
#   0 - US layout at startup (Default)
#   1 - Local language layout at startup
Keyboard Rocker Switch = 0

# Host keyboard mapping mode:
#   0 - Symbolic: Maps keys by character/symbol produced by host OS layout
#       (Default; types what is printed on your physical keys)
#   1 - Positional: Maps physical key locations directly to Apple II keyboard
#       matrix positions (useful for games expecting standard US key locations)
Mapping Mode = 0

# Caps Lock mode:
#   0 - Host: Synchronizes with host OS Caps Lock state (Default)
#   1 - Emulated: Independent Apple II Caps Lock toggle (defaults ON at startup)
Caps Lock Mode = 0

# Modifier key combination for Quick Save / Quick Load (keys 0-9):
#   Alt      - Alt+0..9 to load, Alt+Shift+0..9 to save (Default)
#   Ctrl     - Ctrl+0..9 to load, Ctrl+Shift+0..9 to save
#   AltCtrl  - Ctrl+Alt+0..9 to load, Ctrl+Alt+Shift+0..9 to save
#   Disabled - Quick Save hotkeys disabled
Quick Save Modifier = Alt

# Function key hotkeys (F1-F12):
#   0 - Function keys ignored
#   1 - Function keys enabled (Default)
Enable Hotkeys = 1

# ScrollLock speed unthrottling:
#   0 - Full speed only while holding ScrollLock
#   1 - ScrollLock toggles full speed on/off (Default)
ScrollLock Toggle = 1

# Apple II Mouse Card in Slot 4:
#   0 - Disabled (Default)
#   1 - Enabled (disables Mockingboard/Phasor in Slot 4)
Mouse in slot 4 = 0

# Grab mouse pointer on emulator window click:
#   0 - Disabled
#   1 - Enabled (Default)
Mouse Capture = 1

# Joystick Emulation Mode:
#   0 - Disabled
#   1 - Host gamepad / joystick
#   2 - Keyboard standard (Numpad 1-9 axis, 0 button 1, . button 2)
#   3 - Keyboard centered (auto-centers on key release)
#   4 - Mouse as joystick
Joystick 0 = 2
Joystick 1 = 0

# Host Gamepad Indices, Buttons, and Axes:
Joystick 0 Index    = 0
Joystick 1 Index    = 1
Joystick 0 Button 1 = 0
Joystick 0 Button 2 = 1
Joystick 1 Button 1 = 0
Joystick 0 Axis 0   = 0
Joystick 0 Axis 1   = 1
Joystick 1 Axis 0   = 0
Joystick 1 Axis 1   = 1

# Analog Paddle Trim adjustments (-128 to 127):
PDL X-Trim = 0
PDL Y-Trim = 0

# Quit emulator by pressing two joystick buttons simultaneously:
#   0 - Disabled (Default)
#   1 - Enabled
Joystick Exit Enable   = 0
Joystick Exit Button 0 = 8
Joystick Exit Button 1 = 9

# Parallel Printer Card (Slot 1):
Parallel Printer Filename = Printer.txt
Printer idle limit        = 10
Append to printer file    = 1

# Harddisk Controller Card (Slot 7):
#   0 - Disabled (Default)
#   1 - Enabled
Harddisk Enable = 0

# ProDOS-compatible Clock Card:
#   0   - Disabled
#   1-7 - Slot number for clock card (Default: 4)
Clock Enable = 4

# Super Serial Card (Slot 2):
# Host serial device path (e.g., /dev/ttyUSB0, /dev/ttyS0, /dev/null):
Serial Port = /dev/null

# Route transmitted serial data directly back to receive (loopback test mode):
#   0 - Disabled: Transmit to host Serial Port device (Default)
#   1 - Enabled: Echo sent bytes straight back to the Apple II (no host device
#       needed; useful for testing serial comms and terminal software)
Serial Loopback = 0

[Slots]
# Peripheral card assignments for slots 1-7.
# Run 'linapple --list-hardware' to view all available peripherals.
# Use 'None' to leave a slot empty.
Slot 1 = Parallel Printer
Slot 2 = Super Serial Card
Slot 3 = None
Slot 4 = Mockingboard
Slot 5 = Mockingboard
Slot 6 = Disk II
Slot 7 = Harddisk

[Preferences]
# Default starting directories for file selector dialogs
# (leave blank to default to user XDG data directory, ~/.local/share/linapple/):
Slot 6 Directory       =
HDV Starting Directory =
Save State Directory   =

# Save state file name for F11/F12 saving and loading:
Save State Filename =

# Startup disk images:
Disk Image 1     =
Disk Image 2     =
Harddisk Image 1 =
Harddisk Image 2 =

# Remote FTP server settings for downloading disk images:
FTP Server    = ftp://ftp.apple.asimov.net/pub/apple_II/images/games/
FTP ServerHDD = ftp://ftp.apple.asimov.net/pub/apple_II/images/
FTP UserPass  = anonymous:my-mail@mail.com
FTP Local Dir =

