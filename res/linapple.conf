# LinApple Configuration File
#
# Lines starting with '#' are comments.
# Key and value pairs use the format: Key = Value

[Configuration]

# Machine Architecture & Emulation:
#   0 - Apple ][
#   1 - Apple ][+
#   2 - Apple //e
#   3 - Apple //e Enhanced (Default)
Computer Emulation = 3

# Emulation speed multiplier:
#   0 (slowest) to 40 (fastest), 10 = 1.0 MHz (Default)
Emulation Speed = 10

# Accelerate CPU execution during floppy disk access:
#   0 - Authentic 1x floppy drive speed
#   1 - Fast disk access (Default)
Enhance Disk Speed = 1

# Automatically boot Disk 1 in Slot 6 at startup:
#   0 - Show startup splash / Applesoft prompt (Default)
#   1 - Automatically boot Disk 1
Boot at Startup = 0

# Auto-insert Master.dsk fallback if Drive 1 is empty at startup:
#   0 - Leave Drive 1 empty (Default)
#   1 - Insert Master.dsk automatically
Slot 6 Autoload = 0

# Automatically save state to Save State Filename on exit and restore on
# startup:
#   0 - Disabled (Default)
#   1 - Enabled
Save State On Exit = 0

# Integrated assembly debugger (F7):
#   0 - Debugger enabled (Default)
#   1 - Debugger disabled at runtime
Disable Debugger = 0

# Host file path for bidirectional Applesoft BASIC live syncing:
Basic Live Sync File =

# Applesoft BASIC live sync line numbering:
#   0 - Explicit: Host file lines must begin with BASIC line numbers
#       (e.g. '10 HOME', '20 PRINT') (Default)
#   1 - Positional: File line numbers map directly to BASIC line numbers
#       (1, 2, 3...) without line numbers in the file
Basic Line Numbering = 0

# TUI frontend rendering mode:
#   smart - Unicode half-block / Braille rendering (Default)
#   block - ASCII block rendering
TUI Render Mode = smart

# Video Standard:
#   0 - NTSC (60 Hz, Default)
#   1 - PAL (50 Hz)
Video Standard = 0

# Video Emulation Mode:
#   0 - Custom Monochrome (uses Monochrome Color)
#   1 - Color Standard (Default)
#   2 - Color Text Optimized
#   3 - Color TV Emulation
#   4 - Color Half-Shift
#   5 - Monochrome Amber
#   6 - Monochrome Green
#   7 - Monochrome White
Video Emulation = 1

# Custom Monochrome screen color in hex RGB format:
Monochrome Color = #C0C0C0

# Screen Zoom Factor (e.g. 1.0 = 560x384, 2.0 = 1120x768):
Screen factor = 1.0

# Explicit Window Dimensions (uncomment to override Screen factor):
# Screen Width  = 560
# Screen Height = 384

# Fullscreen display:
#   0 - Windowed mode (Default)
#   1 - Fullscreen mode
Fullscreen = 0

# Multithreaded video rendering:
#   0 - Multithreaded rendering enabled (Default)
#   1 - Singlethreaded rendering (recommended for low-resource platforms)
Singlethreaded = 0

# On-screen disk drive activity LEDs:
#   0 - Hide LEDs
#   1 - Show LEDs (Default)
Show Leds = 1

# Sound Emulation:
#   0 - Disabled
#   1 - SDL Audio enabled (Default)
Sound Emulation = 1

# Volume levels (0 = mute to 31 = maximum):
Speaker Volume      = 15
Mockingboard Volume = 15

# Slot 4 Sound Card Emulation:
#   0 - Uninitialized
#   1 - None
#   2 - Mockingboard (dual AY-3-8910 sound generators, Default)
#   3 - Phasor
Soundcard Type = 2

# Keyboard layout: the national table read in positional mode (Mapping Mode
# under [Keyboard]) while the //e's rocker switch is on. A key the national
# table leaves blank types its US key. No locale is consulted, and the
# national video ROMs are not yet wired to this key, so nothing changes on
# screen.
#   0 - US (Default)
#   1 - UK
#   2 - French
#   3 - German
#   4 - Spanish
#   5 - Italian
#   6 - Swedish
#   7 - Danish
#   8 - Swiss
#   9 - Canadian
#  10 - Japanese (roman)
#  11 - Japanese (kana)
Keyboard Type = 0

# The //e keyboard's rocker switch at startup (Apple //e only): on, the
# national table above is read in positional mode. Shift+F6 toggles it in the
# terminal frontend, with no visible effect in this release, and does nothing
# in the SDL frontends yet.
#   0 - US at startup (Default)
#   1 - Local language at startup
Keyboard Rocker Switch = 0

# ScrollLock speed unthrottling:
#   0 - Full speed only while holding ScrollLock
#   1 - ScrollLock toggles full speed on/off (Default)
ScrollLock Toggle = 1

# AppleMouse II interface card in Slot 4, a legacy shortcut kept for
# existing configurations. The card goes in any slot through [Slots] below
# ('Slot 4 = Mouse Interface', or 'Slot n = Mouse Interface' for another
# slot), which is the preferred way to install it.
#   0 - [Slots] decides what is in Slot 4 (Default)
#   1 - The Mouse Interface takes Slot 4, displacing whatever the 'Slot 4'
#       entry names (the shipped Mockingboard). A save state written before
#       this key worked names that other card in Slot 4; it still loads, with
#       that card in Slot 4 for the session, and the log says so. Save again
#       to carry the mouse.
Mouse in slot 4 = 0

# Take the host mouse pointer for the Apple. Capture happens only when
# something on the Apple side consumes it: a Mouse Interface in any slot, or
# a joystick emulated from the mouse (Joystick 0 or 1 = 4). The first left
# click on the window captures the pointer and is swallowed; the middle button
# captures or releases; a Shift- or Ctrl-click releases, as do losing focus,
# Pause and the debugger. With a mouse card present the pointer runs in
# relative mode, and the card receives one count per hires pixel of the
# displayed picture at any window size; a mouse-emulated joystick beside the
# card then reads the virtual position SDL keeps, clamped to the window.
# In the TUI there is no capture: the terminal's mouse reports drive the card
# while one is configured (see 'Slot n = Mouse Interface'), in pixels where
# the terminal reports them (xterm's 1016 mode) and in character cells
# otherwise. The Apple pointer follows the host pointer, sitting where it
# points within the Apple screen: to about one hires pixel in a terminal that
# reports pixels, and about 3.5 hires pixels per cell otherwise. With no card
# the terminal's own selection keeps working.
#   0 - Never capture; the TUI requests no mouse reports
#   1 - Capture when a consumer is present (Default)
Mouse Capture = 1

# Joystick Emulation Mode:
#   0 - Disabled
#   1 - Host gamepad / joystick
#   2 - Keyboard standard (Numpad 1-9 axis, 0 button 1, . button 2)
#   3 - Keyboard centered (auto-centers on key release)
#   4 - Mouse as joystick
# With 0 nothing is plugged into the game connector. On a II or II Plus the
# three pushbutton inputs then float high and read as pressed, as they do on
# the hardware with no controller, and the host's Alt keys show on PB0 and
# PB1 only while a controller is configured; a //e reads them released
# through its keyboard's pull-down resistors. A //e built without the
# keyboard card reads PB0 and PB1 pressed too through its revision C board's
# pull-ups and runs its self-test at every reset until a controller is
# configured here.
Joystick 0 = 2
Joystick 1 = 0

# Host Gamepad Indices, Buttons, and Axes.
# Joystick 0's first button drives PB0 and its second PB1; the second is
# used only when Joystick 1 = 0. Joystick 1's button drives PB2 and, since a
# second stick's button shares the line, PB1 as well.
Joystick 0 Index    = 0
Joystick 1 Index    = 1
Joystick 0 Button 1 = 0
Joystick 0 Button 2 = 1
Joystick 1 Button 1 = 0
Joystick 0 Axis 0   = 0
Joystick 0 Axis 1   = 1
Joystick 1 Axis 0   = 0
Joystick 1 Axis 1   = 1

# Analog Paddle Trim adjustments (-128 to 127), added to every position of
# every device. Right-Ctrl with the arrow keys adjusts the trim while running
# and Right-Ctrl with keypad 5 clears it.
PDL X-Trim = 0
PDL Y-Trim = 0

# Shift-key mod: the single-wire jumper from the shift key to pushbutton 2
# that some early word processors expected on a II Plus.
#   0 - Stock machine (Default)
#   1 - Jumper installed: PB2 reads low while shift is down and high
#       otherwise. A three-button controller's button 2 then reads as held
#       whenever shift is up, so leave this off unless software needs it.
Shift-key mod = 0

# The emulator is quit from the host (its window or keyboard), never from a
# joystick button.

# Parallel Printer Card (Slot 1):
# The file the printer writes. "~/" is your home directory, and a relative
# path is taken against the Save State Directory, so the default Printer.txt
# lives there rather than where linapple was started from. A second printer
# card writes its own file, named with its slot (Printer-slot2.txt).
Parallel Printer Filename = Printer.txt
# Whether a new run adds to the file (1, Default) or starts it over at the
# first byte it prints (0):
Append to printer file    = 1
# Bit 7 is stripped so the file is plain ASCII text (0, Default); set 1 to
# pass every byte through unchanged, for graphics dumps:
Printer 8-bit output      = 0

# Harddisk Controller Card (Slot 7):
#   0 - Disabled (Default)
#   1 - Enabled
Harddisk Enable = 0

# Super Serial Card (Slot 2):
# The host device the card's RS-232 line is cabled to. It applies to the
# lowest slot holding a Super Serial Card; a second card is unconnected and
# reads its own pull-ups.
#   (empty)      - No device (Default). The card reads its pull-ups, CTS, DSR
#                  and DCD asserted, and what it sends goes nowhere.
#   pty          - A pseudo-terminal is created at startup and its path
#                  (/dev/pts/N) is logged; connect a terminal program or
#                  tcpser to it. With no peer connected the kernel takes
#                  about 4 KiB, after which PR#2 waits on CTS until a peer
#                  drains it.
#   loopback     - A null-modem plug: what the card sends comes back to it.
#   /dev/ttyUSB0 - A host serial port. Baud, word length, parity and stop
#                  bits follow the card's control register (3600 and 7200
#                  baud have no host setting and leave the speed as it was),
#                  DTR and RTS follow its command register, a break is sent
#                  for as long as the firmware holds it, and CTS, DSR and DCD
#                  are read from the port. The far end must honour RTS or
#                  run no faster than the Apple reads, because the host's
#                  buffer overflows silently. With nothing asserting DSR and
#                  DCD, PR#2 waits, as the 1981 manual says it does; Ctrl-
#                  Reset clears the command register, which drops DTR and
#                  hangs up a modem. A port that cannot be opened is retried
#                  once a second.
#   capture.txt  - An existing regular file: what the card sends is appended
#                  to it and nothing is read from it. A relative path is
#                  taken against the Save State Directory.
Serial Port =
# The two blocks of DIP switches, written as the 1981 manual prints them:
# seven ON or OFF tokens, switch 1 first. An empty row is the default; a row
# that does not parse is logged and the default used. The default is
# communications mode at 9600 baud, 8 data bits, no parity, 1 stop bit,
# interrupts forwarded.
#   Switches 1, 1-4, baud rate:
#     ON  ON  ON  OFF 50       OFF ON  ON  ON  1200
#     ON  ON  OFF ON  75       OFF ON  ON  OFF 1800
#     ON  ON  OFF OFF 110      OFF ON  OFF ON  2400
#     ON  OFF ON  ON  135      OFF ON  OFF OFF 3600
#     ON  OFF ON  OFF 150      OFF OFF ON  ON  4800
#     ON  OFF OFF ON  300      OFF OFF ON  OFF 7200
#     ON  OFF OFF OFF 600      OFF OFF OFF ON  9600
#                              OFF OFF OFF OFF 19200
#   Switches 1, 5-6, mode: ON ON communications; OFF ON printer;
#     ON OFF and OFF OFF emulate the Serial Interface Card's P8 and P8A.
#   Switches 1, 7 with Switches 2, 7: the source of DCD; ON and OFF takes
#     it from DB-25 pin 8.
#   Switches 2, 1, stop bits: ON 1; OFF 2.
#   Switches 2, 2: communications mode, data bits: ON 8; OFF 7.
#     Printer mode: ON adds a 1/4 s delay after each CR.
#   Switches 2, 3-4: communications mode, parity: x ON none; ON OFF odd;
#     OFF OFF even. Printer mode, line width: ON ON 40 with video on;
#     ON OFF 72; OFF ON 80; OFF OFF 132.
#   Switches 2, 5: ON sends a LF after each CR; OFF does not.
#   Switches 2, 6: ON forwards the card's interrupts to the Apple, as a
#     card whose owner has set it does; on a real port a change on DSR or
#     DCD then interrupts a machine with no handler for it, as on hardware.
#     Programs that drive the card by interrupt need ON.
Serial Switches 1 = OFF OFF OFF ON ON ON ON
Serial Switches 2 = ON ON ON ON OFF ON OFF

[Slots]
# Peripheral card assignments for slots 1-7.
# Run 'linapple --list-hardware' to view all available peripherals.
# Use 'None' to leave a slot empty.
# A ProDOS clock card or the AppleMouse II interface card goes in any free
# slot, for example:
#   Slot 4 = Clock Card
#   Slot 4 = Mouse Interface
Slot 1 = Parallel Printer
Slot 2 = Super Serial Card
Slot 3 = None
Slot 4 = Mockingboard
Slot 5 = Mockingboard
Slot 6 = Disk II
Slot 7 = Harddisk

