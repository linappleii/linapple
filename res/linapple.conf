[Keyboard.Custom]
# Custom keyboard mappings. Override individual physical keys on top of
# the active base layout.
#
# Syntax:
#   <HostKey> = <NormalKey> [, <ShiftKey>] [, <CtrlKey>]
#
# Supported Host Keys:
#   A-Z, 0-9, F1-F12, Up, Down, Left, Right, Return, Escape, Space, Tab,
#   Backspace, Delete, Minus, Equals, LeftBracket, RightBracket, Backslash,
#   Semicolon, Apostrophe, Grave, Comma, Period, Slash, CapsLock
#
# Supported Target Keys:
#   Single characters: 'a'-'z', 'A'-'Z', '0'-'9', punctuation, accented chars
#   Named keys: Up, Down, Left, Right, Return, Escape, Tab, Space, Backspace,
#               Delete
#   Special Apple II inputs: OpenApple, ClosedApple
#   Hex codes: 0x00 - 0x7F (e.g. 0x0B, $15)
#
# Examples:
#   # WASD directional controls for games:
#   W = Up
#   A = Left
#   S = Down
#   D = Right
#
#   # Swap Z and Y for German QWERTZ keyboards:
#   Z = y, Y
#   Y = z, Z
#
#   # Custom modifier mapping:
#   Tab = OpenApple
