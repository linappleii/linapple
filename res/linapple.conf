# Volume levels (0 = mute to 31 = maximum):
Speaker Volume      = 15
Mockingboard Volume = 15

# Slot 4 Sound Card Emulation:
#   0 - Uninitialized
#   1 - None
#   2 - Mockingboard (dual AY-3-8910 sound generators, Default)
#   3 - Phasor
Soundcard Type = 2

# Keyboard Layout & Video ROM:
#   0 - Automatic (selected from system locale, Default)
#   1 - US QWERTY
#   2 - UK QWERTY
#   3 - French AZERTY
#   4 - German QWERTZ
#   5 - Spanish ES QWERTY
Keyboard Type = 0

# Initial character set rocker switch setting (Apple //e only):
#   0 - US layout at startup (Default)
#   1 - Local language layout at startup
Keyboard Rocker Switch = 0

# Host keyboard mapping mode:
#   0 - Symbolic: Maps keys by character/symbol produced by host OS layout
#       (Default; types what is printed on your physical keys)
#   1 - Positional: Maps physical key locations directly to Apple II keyboard
#       matrix positions (useful for games expecting standard US key locations)
Mapping Mode = 0

# Caps Lock mode:
#   0 - Host: Synchronizes with host OS Caps Lock state (Default)
#   1 - Emulated: Independent Apple II Caps Lock toggle (defaults ON at startup)
Caps Lock Mode = 0

# Modifier key combination for Quick Save / Quick Load (keys 0-9):
#   Alt      - Alt+0..9 to load, Alt+Shift+0..9 to save (Default)
#   Ctrl     - Ctrl+0..9 to load, Ctrl+Shift+0..9 to save
#   AltCtrl  - Ctrl+Alt+0..9 to load, Ctrl+Alt+Shift+0..9 to save
#   Disabled - Quick Save hotkeys disabled
Quick Save Modifier = Alt

# Function key hotkeys (F1-F12):
#   0 - Function keys ignored
#   1 - Function keys enabled (Default)
Enable Hotkeys = 1

# ScrollLock speed unthrottling:
#   0 - Full speed only while holding ScrollLock
#   1 - ScrollLock toggles full speed on/off (Default)
ScrollLock Toggle = 1

# Apple II Mouse Card in Slot 4:
#   0 - Disabled (Default)
#   1 - Enabled (disables Mockingboard/Phasor in Slot 4)
Mouse in slot 4 = 0

# Grab mouse pointer on emulator window click:
#   0 - Disabled
#   1 - Enabled (Default)
Mouse Capture = 1

# Joystick Emulation Mode:
#   0 - Disabled
#   1 - Host gamepad / joystick
#   2 - Keyboard standard (Numpad 1-9 axis, 0 button 1, . button 2)
#   3 - Keyboard centered (auto-centers on key release)
#   4 - Mouse as joystick
Joystick 0 = 2
Joystick 1 = 0

# Host Gamepad Indices, Buttons, and Axes.
# Joystick 0's first button drives PB0 and its second PB1; the second is
# used only when Joystick 1 = 0. Joystick 1's button drives PB2 and, since a
# second stick's button shares the line, PB1 as well.
Joystick 0 Index    = 0
Joystick 1 Index    = 1
Joystick 0 Button 1 = 0
Joystick 0 Button 2 = 1
Joystick 1 Button 1 = 0
Joystick 0 Axis 0   = 0
Joystick 0 Axis 1   = 1
Joystick 1 Axis 0   = 0
Joystick 1 Axis 1   = 1

# Analog Paddle Trim adjustments (-128 to 127), added to every position of
# every device. Right-Ctrl with the arrow keys adjusts the trim while running
# and Right-Ctrl with keypad 5 clears it.
PDL X-Trim = 0
PDL Y-Trim = 0

# Shift-key mod: the single-wire jumper from the shift key to pushbutton 2
# that some early word processors expected on a II Plus.
#   0 - Stock machine (Default)
#   1 - Jumper installed: PB2 reads low while shift is down and high
#       otherwise. A three-button controller's button 2 then reads as held
#       whenever shift is up, so leave this off unless software needs it.
Shift-key mod = 0

# The emulator is quit from the host (its window or keyboard), never from a
# joystick button.

# Parallel Printer Card (Slot 1):
# The file the printer writes. "~/" is your home directory, and a relative
# path is taken against the Save State Directory, so the default Printer.txt
# lives there rather than where linapple was started from. A second printer
# card writes its own file, named with its slot (Printer-slot2.txt).
Parallel Printer Filename = Printer.txt
# Whether a new run adds to the file (1, Default) or starts it over at the
# first byte it prints (0):
Append to printer file    = 1
# Bit 7 is stripped so the file is plain ASCII text (0, Default); set 1 to
# pass every byte through unchanged, for graphics dumps:
Printer 8-bit output      = 0

# Harddisk Controller Card (Slot 7):
#   0 - Disabled (Default)
#   1 - Enabled
Harddisk Enable = 0

# Super Serial Card (Slot 2):
# The host device the card's RS-232 line is cabled to. It applies to the
# lowest slot holding a Super Serial Card; a second card is unconnected and
# reads its own pull-ups.
#   (empty)      - No device (Default). The card reads its pull-ups, CTS, DSR
#                  and DCD asserted, and what it sends goes nowhere.
#   pty          - A pseudo-terminal is created at startup and its path
#                  (/dev/pts/N) is logged; connect a terminal program or
#                  tcpser to it. With no peer connected the kernel takes
#                  about 4 KiB, after which PR#2 waits on CTS until a peer
#                  drains it.
#   loopback     - A null-modem plug: what the card sends comes back to it.
#   /dev/ttyUSB0 - A host serial port. Baud, word length, parity and stop
#                  bits follow the card's control register (3600 and 7200
#                  baud have no host setting and leave the speed as it was),
#                  DTR and RTS follow its command register, a break is sent
#                  for as long as the firmware holds it, and CTS, DSR and DCD
#                  are read from the port. The far end must honour RTS or
#                  run no faster than the Apple reads, because the host's
#                  buffer overflows silently. With nothing asserting DSR and
#                  DCD, PR#2 waits, as the 1981 manual says it does; Ctrl-
#                  Reset clears the command register, which drops DTR and
#                  hangs up a modem. A port that cannot be opened is retried
#                  once a second.
#   capture.txt  - An existing regular file: what the card sends is appended
#                  to it and nothing is read from it. A relative path is
#                  taken against the Save State Directory.
Serial Port =
# The two blocks of DIP switches, written as the 1981 manual prints them:
# seven ON or OFF tokens, switch 1 first. An empty row is the default; a row
# that does not parse is logged and the default used. The default is
# communications mode at 9600 baud, 8 data bits, no parity, 1 stop bit,
# interrupts forwarded.
#   Switches 1, 1-4, baud rate:
#     ON  ON  ON  OFF 50       OFF ON  ON  ON  1200
#     ON  ON  OFF ON  75       OFF ON  ON  OFF 1800
#     ON  ON  OFF OFF 110      OFF ON  OFF ON  2400
#     ON  OFF ON  ON  135      OFF ON  OFF OFF 3600
#     ON  OFF ON  OFF 150      OFF OFF ON  ON  4800
#     ON  OFF OFF ON  300      OFF OFF ON  OFF 7200
#     ON  OFF OFF OFF 600      OFF OFF OFF ON  9600
#                              OFF OFF OFF OFF 19200
#   Switches 1, 5-6, mode: ON ON communications; OFF ON printer;
#     ON OFF and OFF OFF emulate the Serial Interface Card's P8 and P8A.
#   Switches 1, 7 with Switches 2, 7: the source of DCD; ON and OFF takes
#     it from DB-25 pin 8.
#   Switches 2, 1, stop bits: ON 1; OFF 2.
#   Switches 2, 2: communications mode, data bits: ON 8; OFF 7.
#     Printer mode: ON adds a 1/4 s delay after each CR.
#   Switches 2, 3-4: communications mode, parity: x ON none; ON OFF odd;
#     OFF OFF even. Printer mode, line width: ON ON 40 with video on;
#     ON OFF 72; OFF ON 80; OFF OFF 132.
#   Switches 2, 5: ON sends a LF after each CR; OFF does not.
#   Switches 2, 6: ON forwards the card's interrupts to the Apple, as a
#     card whose owner has set it does; on a real port a change on DSR or
#     DCD then interrupts a machine with no handler for it, as on hardware.
#     Programs that drive the card by interrupt need ON.
Serial Switches 1 = OFF OFF OFF ON ON ON ON
Serial Switches 2 = ON ON ON ON OFF ON OFF

