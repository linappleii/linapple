[Keyboard]
# How a host key becomes an Apple key in the SDL frontends. The terminal
# frontend has no key positions, so it always reads the key's symbol.
#   0 - Symbolic: by the character the host layout produces (Default; types
#       what is printed on your keys)
#   1 - Positional: by the key's physical position, through the US table or,
#       with Keyboard Type and the rocker switch, a national one (for games
#       expecting standard US key locations). Under SDL 1.2 positions are
#       read through X11 only; another video driver falls back to the key's
#       symbol.
Mapping Mode = 0

# Caps Lock mode:
#   0 - Host: follows the host's Caps Lock state, at each press of the key
#       and when the window gains focus (Default)
#   1 - Emulated: the Caps Lock key toggles the Apple's own caps, which is
#       down at startup
# A terminal reports no caps state and no Caps Lock key, so the terminal
# frontend types upper case; this key does not apply there.
Caps Lock Mode = 0

# Modifier key combination for Quick Save / Quick Load (keys 0-9):
#   Alt      - Alt+0..9 to load, Alt+Shift+0..9 to save (Default)
#   Ctrl     - Ctrl+0..9 to load, Ctrl+Shift+0..9 to save
#   AltCtrl  - Ctrl+Alt+0..9 to load, Ctrl+Alt+Shift+0..9 to save
#   Disabled - Quick Save hotkeys disabled
Quick Save Modifier = Alt

# Function key hotkeys (F1-F12); Function Keys Enable is an older spelling
# of this key:
#   0 - Function keys ignored
#   1 - Function keys enabled (Default)
Enable Hotkeys = 1

[Keyboard.Custom]
# Custom keyboard mappings. Override individual physical keys on top of
# the active base layout, in the SDL frontends; a key named here is read
# through this table first, whatever Mapping Mode says, and every other key
# keeps its mode. The terminal frontend has no key positions, so this
# section does not apply to it.
#
# Syntax:
#   <HostKey> = <NormalKey> [, <ShiftKey>] [, <CtrlKey>]
#
# Supported Host Keys:
#   A-Z, 0-9, F1-F12, Up, Down, Left, Right, Return, Escape, Space, Tab,
#   Backspace, Delete, Minus, Equals, LeftBracket, RightBracket, Backslash,
#   Semicolon, Apostrophe, Grave, Comma, Period, Slash, CapsLock
#
# Supported Target Keys:
#   Single characters: 'a'-'z', 'A'-'Z', '0'-'9', punctuation, accented chars
#   Named keys: Up, Down, Left, Right, Return, Escape, Tab, Space, Backspace,
#               Delete
#   Special Apple II inputs: OpenApple, SolidApple (also ClosedApple)
#   Rept: the REPT key of a II or II Plus keyboard. Held with a character
#         key it repeats that key, ten times a second on a II and fifteen on
#         a II Plus; alone it repeats nothing on a II Plus. A //e has no REPT
#         key and repeats a held key by itself, so the binding does nothing
#         there. No key is bound to it unless named here.
#   Hex codes: 0x00 - 0x7F (e.g. 0x0B, $15)
#
# Examples:
#   # WASD directional controls for games:
#   W = Up
#   A = Left
#   S = Down
#   D = Right
#
#   # Swap Z and Y for German QWERTZ keyboards:
#   Z = y, Y
#   Y = z, Z
#
#   # Custom modifier mapping:
#   Tab = OpenApple
#
#   # The REPT key of a II Plus keyboard on the grave key:
#   Grave = Rept
